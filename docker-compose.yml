services:
    nginx:
        image: nginx:1.30
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./app:/app
    php:
        build:
            context: .
            dockerfile: PHP.Dockerfile
        volumes:
            - ./app:/app
        environment:
            DB_HOST: 'mysql'
            DB_NAME: 'developmentdb'
            DB_USER: 'developer'
            DB_PASSWORD: 'secret123'
    mysql:
        image: mariadb:lts
        environment:
            MARIADB_ROOT_PASSWORD: 'secret123'
            MARIADB_USER: 'developer'
            MARIADB_PASSWORD: 'secret123'
            MARIADB_DATABASE: 'developmentdb'
        volumes:
            - mysqldata:/var/lib/mysql
        ports:
            - 3306:3306
    phpmyadmin:
        image: phpmyadmin:5.2
        ports:
            - 8080:80
        environment:
            - PMA_HOST=mysql
volumes:
    mysqldata: {}
